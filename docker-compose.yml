version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vehiclerental
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehiclerental"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fleet_server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/vehiclerental?schema=public
      JWT_ACCESS_SECRET: prod_super_secret_access_token_key_12345
      JWT_REFRESH_SECRET: prod_super_secret_refresh_token_key_67890
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      RAZORPAY_KEY_ID: rzp_test_mock_1234567890
      RAZORPAY_KEY_SECRET: mock_razorpay_secret_key_abcdef
    ports:
      - "5000:5000"
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fleet_client
    restart: always
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  pgdata:
  server_uploads:
